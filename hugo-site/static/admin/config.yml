backend:
  name: turbo-github
  turbo_site_id: 0e698737-0d67-440a-ba7d-1ff246e134f0
  branch: estrutura-explore

locale: pt

site_url: https://sauerkrautelectronics.com.br
display_url: https://sauerkrautelectronics.com.br

media_folder: "hugo-site/static/images/uploads"
public_folder: "/images/uploads"

media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 80
  strip_metadata: true
  width: 1600
  height: null

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:

  - name: projetos-abertos
    label: Projetos Abertos
    label_singular: Projeto Aberto
    folder: hugo-site/content/projetos-abertos
    create: true
    delete: false
    filter:
      field: cms_collection
      value: projetos-abertos
    path: "{{slug}}/index"
    extension: md
    format: yaml-frontmatter
    media_folder: ""
    public_folder: ""
    fields:
      - label: Identificação interna
        name: cms_collection
        widget: hidden
        default: projetos-abertos

      - label: Título
        name: title
        widget: string
        required: true

      - label: Data
        name: date
        widget: datetime
        required: true

      - label: Descrição resumida
        name: description
        widget: string
        required: false

      - label: Conteúdo da publicação
        name: blocks
        widget: list
        summary: "{{fields.type}}"
        allow_add: true
        allow_remove: true
        allow_reorder: true
        types:
          - label: Texto
            name: text
            widget: object
            fields:
              - label: Conteúdo
                name: text
                widget: richtext

          - label: Imagem
            name: image
            widget: object
            fields:
              - label: Fotografia
                name: image
                widget: image
              - label: Texto alternativo
                name: alt
                widget: string
                required: false
              - label: Legenda
                name: caption
                widget: string
                required: false

          - label: Vídeo do YouTube
            name: youtube
            widget: object
            fields:
              - label: Endereço do vídeo
                name: url
                widget: string
              - label: Legenda
                name: caption
                widget: string
                required: false

          - label: Hiperlink
            name: link
            widget: object
            fields:
              - label: Texto do link
                name: text
                widget: string
              - label: Endereço do link
                name: url
                widget: string

