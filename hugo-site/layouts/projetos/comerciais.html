<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | Sauerkraut Electronics</title>
    <meta name="description" content="{{ .Description }}">

    <link rel="stylesheet" href="{{ "css/ofertas.css" | relURL }}">
    <script src="{{ "js/ofertas.js" | relURL }}" defer></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #0b1118;
            color: #e8eef5;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #101a25;
            padding: 22px 7%;
            text-align: left;
            border-bottom: 1px solid #263747;
        }

        .site-logo {
            display: block;
            height: 65px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
        }

        .commercial-layout {
            width: 100%;
            max-width: 1700px;
            margin: 0 auto;
            padding: 35px 25px;
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr) 220px;
            gap: 25px;
            align-items: start;
            flex: 1;
        }

        .commercial-layout > .offers-panel {
            position: sticky;
            top: 20px;
        }

        main {
            width: 100%;
            max-width: 900px;
            min-width: 0;
            margin: 0 auto;
            padding: 0 0;
        }

        .breadcrumb {
            margin-bottom: 25px;
            color: #aab8c6;
            font-size: 14px;
        }

        .breadcrumb a {
            color: #42b9e8;
            text-decoration: none;
        }

        h1 {
            color: #48c3ee;
            margin-bottom: 20px;
        }

        h2 {
            color: #42b9e8;
            margin-top: 35px;
            margin-bottom: 15px;
        }

        h3 {
            color: #48c3ee;
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 18px;
        }

        .notice {
            background: #101a25;
            border-left: 4px solid #159ed0;
            padding: 18px 22px;
            margin: 25px 0;
            border-radius: 5px;
        }

        .project-card {
            background: #101a25;
            border: 1px solid #263747;
            border-radius: 6px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .important {
            background: #101e2b;
            border: 1px solid #26394b;
            border-left: 4px solid #159ed0;
            border-radius: 8px;
            padding: 22px;
            margin: 25px 0;
        }

        ul {
            padding-left: 22px;
        }

        li {
            margin-bottom: 8px;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            background: #159ed0;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 5px;
            font-weight: bold;
        }

        .back-link:hover {
            background: #087eaa;
        }

        footer {
            text-align: center;
            padding: 22px;
            margin-top: 45px;
            background: #101a25;
            border-top: 1px solid #263747;
            color: #aab8c6;
            font-size: 13px;
        }

        @media (max-width: 1100px) {
            .commercial-layout {
                grid-template-columns: minmax(0, 1fr);
                max-width: 900px;
            }

            .commercial-layout > .offers-panel {
                position: static;
            }

            main {
                max-width: none;
            }
        }

        @media (max-width: 600px) {
            main {
                padding: 0 18px;
            }

            header {
                padding: 18px 12px;
                text-align: left;
            }

            .site-logo {
                height: 55px;
            }

            .commercial-layout {
                padding: 25px 15px;
                gap: 20px;
            }

            .project-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <header>
        <img src="{{ "images/logo-sauerkraut.png" | relURL }}" alt="Sauerkraut Electronics" class="site-logo">
    </header>

    <div class="commercial-layout">

        {{ partial "ofertas.html" . }}

        <main>
            <nav class="breadcrumb" aria-label="Navegação">
                <a href="{{ "/" | relURL }}">Página inicial</a>
                / {{ .Title }}
            </nav>

            <h1>{{ .Title }}</h1>

            <div class="page-content">
                {{ .Content }}
            </div>

            <a class="back-link" href="{{ "/" | relURL }}">
                Voltar à página inicial
            </a>
        </main>

        {{ partial "ofertas.html" . }}

    </div>

    <footer>
        © 2026 Sauerkraut Electronics. Todos os direitos reservados.
    </footer>
</body>
</html>
