
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ .Title }} | Sauerkraut Electronics</title>
    <meta name="description" content="{{ .Description }}">

    <link rel="stylesheet" href="{{ "css/ofertas.css" | relURL }}">
    <script src="{{ "js/ofertas.js" | relURL }}" defer></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1118;
            color: #e8edf3;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #101a25;
            border-bottom: 1px solid #26394b;
            padding: 22px 7%;
        }

        .logo {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #42b9e8;
        }

        .projects-layout {
            width: 100%;
            max-width: 1700px;
            margin: 0 auto;
            padding: 40px 25px;
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr) 220px;
            gap: 25px;
            align-items: start;
            flex: 1;
        }

        .projects-layout > .offers-panel {
            position: sticky;
            top: 20px;
        }

        main {
            width: 100%;
            min-width: 0;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 0;
        }

        .breadcrumb {
            margin-bottom: 30px;
            font-size: 0.95rem;
            color: #aab9c8;
        }

        a {
            color: #48c3ee;
        }

        .intro {
            margin-bottom: 35px;
        }

        h1 {
            color: #ffffff;
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1.2;
            margin-bottom: 20px;
        }

        h2 {
            color: #48c3ee;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        p {
            color: #c5ced8;
            margin-bottom: 15px;
        }

        .coming-soon {
            background: #101e2b;
            border: 1px solid #26394b;
            border-left: 4px solid #159ed0;
            border-radius: 8px;
            padding: 28px;
            margin-top: 30px;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            background: #159ed0;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 5px;
            font-weight: bold;
        }

        .back-link:hover {
            background: #087eaa;
        }

        footer {
            background: #070c12;
            border-top: 1px solid #26394b;
            text-align: center;
            padding: 25px 20px;
            color: #91a1b1;
            font-size: 0.9rem;
        }

        @media (max-width: 1100px) {
            .projects-layout {
                grid-template-columns: minmax(0, 1fr);
                max-width: 850px;
            }

            .projects-layout > .offers-panel {
                position: static;
            }

            main {
                max-width: none;
                padding: 20px 0;
            }
        }

        @media (max-width: 600px) {
            header {
                text-align: center;
                padding: 18px 12px;
            }

            .projects-layout {
                padding: 25px 15px;
                gap: 20px;
            }

            main {
                padding: 20px 5px;
            }

            .coming-soon {
                padding: 22px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">SAUERKRAUT <span>ELECTRONICS</span></div>
    </header>

    <div class="projects-layout">

        {{ partial "ofertas.html" . }}

        <main>
            <nav class="breadcrumb" aria-label="Navegação">
                <a href="{{ "/" | relURL }}">Página inicial</a>
                / {{ .Title }}
            </nav>

            <section class="intro">
                <h1>{{ .Title }}</h1>
                {{ .Content }}
            </section>

            <a class="back-link" href="{{ "/" | relURL }}">
                Voltar à página inicial
            </a>
        </main>

        {{ partial "ofertas.html" . }}

    </div>

    <footer>
        <p>© 2026 Sauerkraut Electronics. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
